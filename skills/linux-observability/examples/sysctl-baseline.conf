# Conservative sysctl baseline for Linux servers
# Place in /etc/sysctl.d/90-baseline.conf, then: sysctl --system
# Each value has a rationale; do not blanket-copy tuning from other hosts.

# ─── Memory / page cache ────────────────────────────────────────────────────
# Keep the kernel from aggressive anonymous-page swapping on servers.
vm.swappiness = 10
# Lower dirty ratios bound writeback stalls (latency) at the cost of burst throughput.
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10
# Dirty page expiry (centiseconds): 30s is a sane latency/throughput compromise.
vm.dirty_expire_centisecs = 3000
# Slightly favor keeping dentries/inodes for filesystem-heavy hosts; reduce if
# memory pressure dominates.
vm.vfs_cache_pressure = 50
# Overcommit: 0 (heuristic) avoids surprises from JVM/database reservations.
vm.overcommit_memory = 0

# ─── Network core ───────────────────────────────────────────────────────────
# Accept queues and backlog sized for 1G/10G workloads; raise per measured drops.
net.core.somaxconn = 4096
net.core.netdev_max_backlog = 5000
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
# Ephemeral port range for high-connection hosts (proxies, CDN edges).
net.ipv4.ip_local_port_range = 10240 65535
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_tw_reuse = 1
# SYN flood resilience (enable only with measured need).
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 8192
# Keepalive: detect dead peers faster on long-lived connections.
net.ipv4.tcp_keepalive_time = 600
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 5

# ─── Forwarding / conntrack ─────────────────────────────────────────────────
# Enable forwarding on gateway/NAT hosts (leave 0 for plain app hosts).
net.ipv4.ip_forward = 0
# Conntrack sized to expected flow count; watch nf_conntrack_count/max alert.
net.netfilter.nf_conntrack_max = 262144
net.netfilter.nf_conntrack_tcp_timeout_established = 86400
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 60

# ─── Kernel / filesystem ────────────────────────────────────────────────────
# Inotify watchers for build tools and log shippers.
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
# File handles for busy proxy/web hosts.
fs.file-max = 2097152
# PID headroom for container hosts.
kernel.pid_max = 4194304
# Perf/tracing visibility for diagnostics (tighten if policy requires).
kernel.perf_event_paranoid = 1
kernel.kptr_restrict = 1

# ─── Notes ──────────────────────────────────────────────────────────────────
# * Apply in a maintenance window on production; test on a canary host first.
# * Verify effect: sysctl -a | grep <key>; and re-measure the metric you changed
#   the value for (PSI, retransmits, listen overflows, latency).
# * Container hosts: some keys are namespace-scoped (net.*) — set them in the
#   container's own namespace or via the runtime, not only on the node.
