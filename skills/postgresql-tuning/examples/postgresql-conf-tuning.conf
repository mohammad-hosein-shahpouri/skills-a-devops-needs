# Annotated production postgresql.conf for an OLTP server
# Assumptions: 32 cores, 128 GB RAM, NVMe storage, pgbouncer in front,
#               PostgreSQL 15-17, single primary + streaming standbys.
# Values are starting points — tune by measurement, one knob at a time.

# ─── Connections ─────────────────────────────────────────────────────────────
listen_addresses = '*'
max_connections = 200                 # keep low; pool in front with pgbouncer
superuser_reserved_connections = 3

# ─── Memory ──────────────────────────────────────────────────────────────────
shared_buffers = 32GB                 # ~25% of RAM
effective_cache_size = 88GB           # planner hint (~69% RAM); no allocation
work_mem = 16MB                       # global; heavy reports override per role
maintenance_work_mem = 1GB            # VACUUM/ANALYZE/CREATE INDEX
hash_mem_multiplier = 1.0
temp_buffers = 16MB

# ─── WAL & Checkpoints ───────────────────────────────────────────────────────
wal_level = replica
max_wal_size = 8GB                    # absorb write bursts between checkpoints
min_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
wal_compression = on
wal_buffers = 16MB
synchronous_commit = on               # durability first; 'local' is a documented trade

# ─── Archiving (PITR) ────────────────────────────────────────────────────────
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/archive/%f && cp %p /var/lib/postgresql/archive/%f'
archive_timeout = 15min               # force a segment switch so archives stay fresh

# ─── Planner Costs (NVMe) ────────────────────────────────────────────────────
random_page_cost = 1.1
seq_page_cost = 1.0
effective_io_concurrency = 200
default_statistics_target = 100

# ─── Parallel Query ──────────────────────────────────────────────────────────
max_worker_processes = 16
max_parallel_workers = 16
max_parallel_workers_per_gather = 2   # conservative for OLTP latency
max_parallel_maintenance_workers = 2

# ─── Timeouts (safety rails) ─────────────────────────────────────────────────
statement_timeout = '30s'             # per-role overrides for reporting
lock_timeout = '5s'
idle_in_transaction_session_timeout = '5min'
idle_session_timeout = '30min'
deadlock_timeout = '1s'

# ─── Autovacuum ──────────────────────────────────────────────────────────────
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = '15s'
autovacuum_vacuum_scale_factor = 0.05
autovacuum_vacuum_insert_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_delay = '2ms'
autovacuum_vacuum_cost_limit = 2000
autovacuum_freeze_max_age = 300000000

# ─── Logging (slow query visibility) ─────────────────────────────────────────
logging_collector = on
log_min_duration_statement = '1000ms'  # log slow statements; samples verify pg_stat_statements
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0                     # any temp file is worth knowing
log_autovacuum_min_duration = '5s'
log_line_prefix = '%m [%p] %q%u@%d/%a '

# ─── Replication ─────────────────────────────────────────────────────────────
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 2GB                    # safety net when slots are absent
hot_standby = on

# ─── Extensions ──────────────────────────────────────────────────────────────
shared_preload_libraries = 'pg_stat_statements'

# ─── Notes ───────────────────────────────────────────────────────────────────
# - Restart required: shared_buffers, max_connections, wal_level,
#   max_worker_processes, shared_preload_libraries.
# - Reload sufficient: work_mem, autovacuum settings, planner costs, timeouts.
# - Keep work_mem × concurrent sorts/hashes × sessions under control; use
#   pg_stat_database.temp_bytes to detect spill.
